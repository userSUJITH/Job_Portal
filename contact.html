<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <link rel="stylesheet" href="./css/contact.css">
</head>
<body>

<header>

    <h1>Job Portal</h1>

    <nav>

        <ul>

            <li>
                <a href="./index.html">Home</a>
            </li>

            <li>
                <a href="./jobs.html">Jobs</a>
            </li>

            <li>
                <button id="themeBtn">
                    🌙
                </button>
            </li>

        </ul>

    </nav>

</header>


<main>

<section class="contact-container">

    <div class="contact-info">

        <h1>Contact Us</h1>

        <p>
            Have questions? We'd love to hear from you.
        </p>

        <div class="info">
            📧 sujith29827@gmail.com
        </div>

        <div class="info">
            📞 +91 7816071920
        </div>

        <div class="info">
            📍 Chennai, India
        </div>

    </div>


    <div class="contact-form">

        <form id="contactForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="text"
                id="subject"
                placeholder="Subject"
            >

            <textarea
                id="message"
                rows="6"
                placeholder="Message"
                required
            ></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

</main>

<script src="./js/contact.js"></script>

</body>
</html>
